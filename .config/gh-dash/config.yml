# yaml-language-server: $schema=https://gh-dash.dev/schema.json
prSections:
  - title: Ready to merge
    filters: is:open author:@me status:success review:approved sort:updated-asc
  - title: Failed
    filters: is:open author:@me status:failure draft:false sort:updated-asc
  - title: Needs Review
    filters: is:open review-requested:@me -is:draft status:success sort:updated-asc
  - title: My Reviews
    filters: is:open reviewed-by:@me sort:updated-asc
  - title: My PRs
    filters: is:open author:@me sort:updated-asc
  - title: Open
    filters: is:open -is:draft sort:updated-asc -author:@me
  - title: Drafts
    filters: is:open is:draft sort:updated-asc -author:@me
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
defaults:
  preview:
    open: true
    width: 80
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
      author:
        width: 15
      authorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  universal:
    - key: "J"
      builtin: "pageDown"
    - key: "K"
      builtin: "pageUp"
  prs:
    - key: "H"
      builtin: "prevSidebarTab"
    - key: "L"
      builtin: "nextSidebarTab"
repoPaths:
  executive-office-of-education/*: ~/Code/*
  MightyAcornDigital/*: ~/Code/*
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: false
pager:
  diff: delta
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
